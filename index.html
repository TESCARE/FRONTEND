<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0C1A11" />

    <title>Tescare - Professional Pest Control &amp; Bird Netting</title>
    <meta name="description" content="Tescare — professional pest control and bird netting services for homes, apartments and commercial spaces in Chennai. Book a free inspection today." />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Link previews (WhatsApp, Facebook, LinkedIn). The logo is a 3:1
         lockup, so without a dedicated 1200x630 card these apps crop it to
         a square and the name is cut to "ESCA". -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tescare" />
    <meta property="og:title" content="Tescare — Professional Pest Control &amp; Bird Netting" />
    <meta property="og:description" content="Safe, odourless pest control and invisible bird netting for homes, apartments and commercial spaces across Chennai. Book a free inspection." />
    <meta property="og:url" content="https://tescareservices.com/" />
    <!-- Square share image: WhatsApp renders the preview thumbnail as a
         square, so the 1200x630 banner was being centre-cropped and the
         name cut off. The shield mark fills a square cleanly. -->
    <meta property="og:image" content="https://tescareservices.com/og-square.png" />
    <meta property="og:image:secure_url" content="https://tescareservices.com/og-square.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="1024" />
    <meta property="og:image:alt" content="Tescare — Pest Control &amp; Bird Netting, Chennai" />
    <meta property="og:locale" content="en_IN" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Tescare — Professional Pest Control &amp; Bird Netting" />
    <meta name="twitter:description" content="Safe, odourless pest control and invisible bird netting for homes, apartments and commercial spaces across Chennai." />
    <meta name="twitter:image" content="https://tescareservices.com/og-square.png" />

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  </head>
